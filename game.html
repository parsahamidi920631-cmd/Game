<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جنگ کشورها</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mu:#667;--ac:#2563eb;--rd:#dc2626;--gr:#16a34a;--bd:#dde0e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f27;--tx:#eceef2;--mu:#99a;--bd:#2c303b;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
main{max-width:640px;margin:0 auto;padding:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2,h3{margin:0 0 8px}h3{font-size:16px}
input,select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%;box-sizing:border-box}
input,select{margin:3px 0;width:100%}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;margin:2px}
button.r{background:var(--rd)}button.g{background:var(--gr)}button.x{background:var(--mu)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--bd);padding:8px 0}
.row:first-of-type{border-top:0}
.st{display:flex;gap:8px;flex-wrap:wrap}.st b{background:var(--bg);padding:4px 10px;border-radius:8px}
.mu{color:var(--mu);font-size:13px}
#msg{position:sticky;top:0;z-index:5}
#msg div{background:var(--rd);color:#fff;padding:8px;border-radius:8px;margin-bottom:8px}
.hide{display:none}
#map{text-align:center;cursor:grab;user-select:none}
</style>
</head>
<body>
<main>
<div id="msg"></div>
<div id="boot" class="c">در حال اتصال...</div>
<div class="c"><div id="map"></div>
<div style="text-align:center"><button data-a="zi">＋</button><button data-a="zo">－</button></div>
<div class="mu" id="mm" style="text-align:center"></div>
<div class="mu" style="text-align:center">بکشید تا بچرخد | 🟨 کشور شما &nbsp; 🟦 کشورهای ثبت‌شده &nbsp; 🟥 در جنگ با شما</div></div>

<div id="login" class="c hide">
<h2>ورود بازیکن</h2>
<select id="n"></select>
<input id="u" placeholder="UID" dir="ltr">
<button data-a="reg">ورود</button>
</div>

<div id="game" class="hide">
<div class="c"><h2 id="gt"></h2><div class="st" id="gs"></div><button class="g" data-a="collect">دریافت درآمد</button></div>
<div class="c"><h3>فروشگاه</h3><div id="shop"></div></div>
<div class="c"><h3>دارایی‌های من</h3><div id="inv" class="mu"></div></div>
<div class="c"><h3>کشورها: جنگ و صلح</h3><div id="wars"></div></div>
<div class="c"><h3>چت</h3><select id="ct"></select><div id="cl" style="max-height:220px;overflow:auto;margin:6px 0"></div><input id="cm" maxlength="200" placeholder="پیام..."><button data-a="send">ارسال</button></div>
<button class="x" data-a="logout">خروج</button>
</div>

<div id="lock" class="c hide"><h2>ورود مدیر</h2><div class="mu" id="lt"></div><input id="pw" type="password" placeholder="رمز"><button data-a="unlock">ورود</button></div>

<div id="admin" class="hide">
<button class="x" data-a="exitadm">↩ خروج از پنل مدیر</button>
<div class="c"><h3>تغییر رمز مدیر</h3><input id="np" type="password" placeholder="رمز جدید"><button data-a="setpw">ذخیره رمز</button></div>
<div class="c"><h3>افزودن بازیکن (UID و کشور)</h3>
<input id="au" placeholder="UID (حروف انگلیسی و عدد، بلند و غیرقابل‌حدس)" dir="ltr"><select id="ac"></select><input id="am" type="number" placeholder="پول اولیه">
<button data-a="addc">افزودن</button></div>
<div class="c"><h3>بازیکن‌ها و مدیریت پول</h3>
<input id="amt" type="number" placeholder="مبلغ برای + و −"><input id="nuid" placeholder="UID جدید (برای دکمهٔ تغییر UID)" dir="ltr">
<div id="pl"></div></div>
<div class="c"><h3>افزودن آیتم به فروشگاه</h3>
<input id="sn" placeholder="اسم آیتم">
<select id="sc"><option value="weapons">تجهیزات جنگی</option><option value="energy">راکتور و معدن</option><option value="welfare">بیمارستان و خدمات رفاهی</option></select>
<input id="sp" type="number" placeholder="قیمت"><input id="si" type="number" placeholder="درآمد در دقیقه (+)"><input id="sa" type="number" placeholder="قدرت حمله (+)"><input id="sd" type="number" placeholder="قدرت دفاع (+)">
<button data-a="adds">افزودن آیتم</button></div>
<div class="c"><h3>آیتم‌های فروشگاه</h3><div id="sl"></div></div>
<div class="c"><h3>جنگ‌ها</h3><div id="wl"></div></div>
<div class="c"><h3>نظارت بر چت</h3><div id="mod"></div></div>
</div>
</main>
<script>
const API="https://fgvpfktrswadclhmkzol.supabase.co/rest/v1/rpc/",KEY="sb_publishable_NhAy0p8790YIsxHVoCFt-Q_WpxfcqWs";
const CAT={weapons:"تجهیزات جنگی",energy:"راکتور و معدن",welfare:"بیمارستان و خدمات رفاهی"};
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(n).toLocaleString("fa-IR"),num=i=>Number($(i).value)||0;
const nu=s=>s.trim().replace(/[\u06f0-\u06f9]/g,c=>c.charCodeAt(0)-1776).replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632),okU=u=>/^[A-Za-z0-9_.~:@+-]+$/.test(u);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let myId=Number(ls("id"))||null,tok=ls("tok"),pw=null,S={countries:[],shop:[],wars:[],chat:[]},last="",flown=false;
try{pw=sessionStorage.getItem("pw")}catch(e){}
const ERR={uid:"UID نامعتبر است",used:"این UID قبلاً استفاده شده",auth:"ورود نامعتبر؛ دوباره وارد شوید",money:"پول کافی نیست",wait:"کمی صبر کنید",muted:"شما توسط مدیر بی‌صدا شده‌اید",nowar:"با این کشور در جنگ نیستید",pw:"رمز اشتباه است",dup:"تکراری است",short:"رمز حداقل ۴ حرف باشد",item:"نامعتبر"};
function err(t,ok){const d=document.createElement("div");d.textContent=t;if(ok)d.style.background="#16a34a";$("msg").append(d);setTimeout(()=>d.remove(),4000)}
async function rpc(fn,a){const r=await fetch(API+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(a||{})});const j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j}
async function call(fn,a){const j=await rpc(fn,a);if(j&&j.err){err(ERR[j.err]||j.err);return null}return j}
const P=()=>({p_id:myId,p_token:tok}),AD=a=>({p_pw:pw,...a});
async function poll(){try{const s=await rpc("get_state",{p_id:myId,p_token:tok,p_pw:pw});$("boot").classList.add("hide");const k=JSON.stringify(s);if(k!==last){last=k;S=s;render()}}catch(e){$("boot").textContent="خطا در اتصال: "+e.message;$("boot").classList.remove("hide")}}
const go=async f=>{try{await f()}catch(e){err("خطا: "+e.message)}await poll()};
const wr=id=>myId&&S.wars.find(w=>w.lo===Math.min(id,myId)&&w.hi===Math.max(id,myId));
const cn=id=>{const c=S.countries.find(x=>x.id===id);return c?c.country:"?"};

const A2="AFG:AF,AGO:AO,ALB:AL,ARE:AE,ARG:AR,ARM:AM,AUS:AU,AUT:AT,AZE:AZ,BDI:BI,BEL:BE,BEN:BJ,BFA:BF,BGD:BD,BGR:BG,BHS:BS,BIH:BA,BLR:BY,BLZ:BZ,BOL:BO,BRA:BR,BRN:BN,BTN:BT,BWA:BW,CAF:CF,CAN:CA,CHE:CH,CHL:CL,CHN:CN,CIV:CI,CMR:CM,COD:CD,COG:CG,COL:CO,CRI:CR,CUB:CU,CYP:CY,CZE:CZ,DEU:DE,DJI:DJ,DNK:DK,DOM:DO,DZA:DZ,ECU:EC,EGY:EG,ERI:ER,ESP:ES,EST:EE,ETH:ET,FIN:FI,FJI:FJ,FRA:FR,GAB:GA,GBR:GB,GEO:GE,GHA:GH,GIN:GN,GMB:GM,GNB:GW,GNQ:GQ,GRC:GR,GRL:GL,GTM:GT,GUY:GY,HND:HN,HRV:HR,HTI:HT,HUN:HU,IDN:ID,IND:IN,IRL:IE,IRN:IR,IRQ:IQ,ISL:IS,ISR:IL,ITA:IT,JAM:JM,JOR:JO,JPN:JP,KAZ:KZ,KEN:KE,KGZ:KG,KHM:KH,KOR:KR,KWT:KW,LAO:LA,LBN:LB,LBR:LR,LBY:LY,LKA:LK,LSO:LS,LTU:LT,LUX:LU,LVA:LV,MAR:MA,MDA:MD,MDG:MG,MEX:MX,MKD:MK,MLI:ML,MMR:MM,MNE:ME,MNG:MN,MOZ:MZ,MRT:MR,MWI:MW,MYS:MY,NAM:NA,NER:NE,NGA:NG,NIC:NI,NLD:NL,NOR:NO,NPL:NP,NZL:NZ,OMN:OM,PAK:PK,PAN:PA,PER:PE,PHL:PH,PNG:PG,POL:PL,PRK:KP,PRT:PT,PRY:PY,PSE:PS,QAT:QA,ROU:RO,RUS:RU,RWA:RW,SAU:SA,SDN:SD,SEN:SN,SLB:SB,SLE:SL,SLV:SV,SOM:SO,SRB:RS,SSD:SS,SUR:SR,SVK:SK,SVN:SI,SWE:SE,SWZ:SZ,SYR:SY,TCD:TD,TGO:TG,THA:TH,TJK:TJ,TKM:TM,TLS:TL,TTO:TT,TUN:TN,TUR:TR,TWN:TW,TZA:TZ,UGA:UG,UKR:UA,URY:UY,USA:US,UZB:UZ,VEN:VE,VNM:VN,VUT:VU,YEM:YE,ZAF:ZA,ZMB:ZM,ZWE:ZW".split(",").reduce((o,x)=>{const[a,b]=x.split(":");o[a]=b;return o},{});
function lab(code,en){let f="";try{f=new Intl.DisplayNames(["fa"],{type:"region"}).of(A2[code])}catch(e){}return f&&f!==A2[code]?`${en} (${f})`:en}
function fillSel(list){["ac","n"].forEach(id=>{const s=$(id);s.innerHTML="";list.forEach(([i,n])=>s.add(new Option(lab(i,n),i)))})}

function render(){
 const adm=location.hash==="#admin",me=S.me;
 if(myId&&!me){ls("id",null);ls("tok",null);myId=tok=null}
 if(pw&&!S.adm){pw=null;try{sessionStorage.removeItem("pw")}catch(e){}}
 $("lt").textContent=S.haspw?"رمز مدیر را وارد کنید":"اولین بار است: یک رمز برای پنل مدیر بسازید";
 $("lock").classList.toggle("hide",!(adm&&!S.adm));$("admin").classList.toggle("hide",!(adm&&S.adm));
 $("login").classList.toggle("hide",adm||!!me);$("game").classList.toggle("hide",adm||!me);
 if(adm&&S.adm)rAdmin();else if(!adm&&me)rGame();
 rMap(adm)}
function rGame(){
 const m=S.me;$("gt").textContent=m.name+" ("+cn(m.id)+")";
 $("gs").innerHTML=`<b>💰 ${fmt(m.money)}</b><b>📈 درآمد/دقیقه ${fmt(m.inc)}</b><b>⚔️ حمله ${fmt(m.atk)}</b><b>🛡️ دفاع ${fmt(m.def)}</b>`;
 let h="";for(const c in CAT){const l=S.shop.filter(s=>s.cat===c);
  h+=`<h3 class="mu">${CAT[c]}</h3>`+(l.length?l.map(s=>`<div class="row"><div>${esc(s.name)}<div class="mu">قیمت ${fmt(s.price)}${s.inc?` | درآمد +${s.inc}`:""}${s.atk?` | حمله +${s.atk}`:""}${s.def?` | دفاع +${s.def}`:""}</div></div><button data-a="buy" data-id="${s.id}">خرید</button></div>`).join(""):`<div class="mu">آیتمی نیست</div>`)}
 $("shop").innerHTML=h;
 const inv=Object.entries(m.items||{}).map(([id,q])=>{const s=S.shop.find(x=>x.id==id);return s?`${esc(s.name)} × ${q}`:""}).filter(Boolean);
 $("inv").textContent=inv.join("، ")||"هنوز چیزی نخریده‌اید";
 $("wars").innerHTML=S.countries.filter(c=>c.id!==myId).map(c=>{const w=wr(c.id),st=w?w.st:"peace";let b="",l="🕊️ صلح";
  if(st==="war"){l="⚔️ در جنگ";b=`<button class="r" data-a="atk" data-id="${c.id}">حمله</button><button class="g" data-a="pp" data-id="${c.id}">پیشنهاد صلح</button>`}
  else if(st==="proposal"){l="درخواست صلح";b=w.by_===myId?`<span class="mu">منتظر پاسخ</span>`:`<button class="g" data-a="acc" data-id="${c.id}">قبول صلح</button><button class="r" data-a="war" data-id="${c.id}">رد (ادامه جنگ)</button>`}
  else b=`<button class="r" data-a="war" data-id="${c.id}">اعلان جنگ</button>`;
  return `<div class="row"><div>${esc(c.country)} - ${esc(c.reg?c.name:"بدون بازیکن")}<div class="mu">${l} | پول ${fmt(c.money)}</div></div><div>${b}</div></div>`}).join("")||`<div class="mu">کشور دیگری نیست</div>`;
 rChat()}
function rChat(){const s=$("ct"),cur=s.value||"all";
 const h='<option value="all">📢 چت عمومی</option>'+S.countries.filter(c=>c.id!==myId&&c.reg).map(c=>`<option value="${c.id}">✉️ ${esc(c.country)}</option>`).join("");
 if(s.dataset.h!==h){s.innerHTML=h;s.dataset.h=h}
 s.value=[...s.options].some(o=>o.value===cur)?cur:"all";
 const t=s.value==="all"?null:Number(s.value),l=S.chat.filter(m=>t===null?m.to===null:(m.frm===myId&&m.to===t)||(m.frm===t&&m.to===myId)).slice(-50);
 const bx=$("cl"),bot=bx.scrollTop+bx.clientHeight>=bx.scrollHeight-30;
 bx.innerHTML=l.map(m=>`<div><b>${esc(m.fn)}</b>: ${esc(m.x)}</div>`).join("")||'<div class="mu">پیامی نیست</div>';
 if(bot)bx.scrollTop=bx.scrollHeight}
function rAdmin(){
 $("pl").innerHTML=S.countries.map(c=>`<div class="row"><div>${esc(c.country)} <span class="mu">(${esc(c.reg?c.name:"ثبت‌نام نشده")} | ${esc(c.uid)})</span>${c.muted?" 🔇":""}<div>💰 ${fmt(c.money)}</div></div><div><button class="g" data-a="plus" data-id="${c.id}">+</button><button class="r" data-a="minus" data-id="${c.id}">−</button><button data-a="chuid" data-id="${c.id}">تغییر UID</button><button class="x" data-a="mute" data-id="${c.id}">${c.muted?"رفع بی‌صدا":"بی‌صدا"}</button>${c.reg?`<button class="x" data-a="reset" data-id="${c.id}">ریست ورود</button>`:""}<button class="x" data-a="delc" data-id="${c.id}">حذف</button></div></div>`).join("")||`<div class="mu">بازیکنی نیست</div>`;
 $("sl").innerHTML=S.shop.map(s=>`<div class="row"><div>${esc(s.name)} <span class="mu">${CAT[s.cat]||""} | ${fmt(s.price)} | درآمد ${s.inc} حمله ${s.atk} دفاع ${s.def}</span></div><button class="r" data-a="dels" data-id="${s.id}">حذف</button></div>`).join("")||`<div class="mu">آیتمی نیست</div>`;
 $("wl").innerHTML=S.wars.filter(w=>w.st!=="peace").map(w=>`<div class="row"><div>${esc(cn(w.lo))} ⚔️ ${esc(cn(w.hi))} <span class="mu">${w.st==="war"?"جنگ":"پیشنهاد صلح"}</span></div><button class="g" data-a="peace" data-lo="${w.lo}" data-hi="${w.hi}">صلح اجباری</button></div>`).join("")||`<div class="mu">جنگی نیست</div>`;
 $("mod").innerHTML=S.chat.slice().reverse().slice(0,40).map(m=>`<div class="row"><div>${esc(m.fn)} ${m.to===null?"📢":"→ "+esc(cn(m.to))}<div>${esc(m.x)}</div></div><button class="r" data-a="delm" data-id="${m.id}">حذف</button></div>`).join("")||'<div class="mu">پیامی نیست</div>'}

/* کره زمین */
let gp,gdraw,gc,gs,gf,gpaths,K={};
const COL={me:"#facc15",taken:"#3b82f6",war:"#ef4444"};
function setS(s){s=Math.max(90,Math.min(520,s));gp.scale(s);gc.attr("r",s);gs.attr("r",s);gdraw()}
function initGlobe(){
 if(gp||typeof d3==="undefined"||typeof Datamap==="undefined"||typeof topojson==="undefined")return;
 const topo=Datamap.prototype.worldTopo;gf=topojson.feature(topo,topo.objects.world).features;
 gp=d3.geo.orthographic().scale(150).translate([180,180]).clipAngle(90).rotate([20,-20]);
 const path=d3.geo.path().projection(gp);
 const svg=d3.select("#map").append("svg").attr("viewBox","0 0 360 360").style("width","100%").style("max-width","440px").style("touch-action","none");
 const df=svg.append("defs").append("radialGradient").attr("id","shd").attr("cx","35%").attr("cy","35%").attr("r","75%");
 df.append("stop").attr("offset","0%").attr("stop-color","#fff").attr("stop-opacity",.25);
 df.append("stop").attr("offset","100%").attr("stop-color","#000").attr("stop-opacity",.45);
 gc=svg.append("circle").attr("cx",180).attr("cy",180).attr("r",150).attr("fill","#1e4f8a");
 gpaths=svg.append("g").selectAll("path").data(gf).enter().append("path").attr("stroke","#0b1b2e").attr("stroke-width",.3);
 gs=svg.append("circle").attr("cx",180).attr("cy",180).attr("r",150).attr("fill","url(#shd)").style("pointer-events","none");
 gdraw=()=>gpaths.attr("d",path).attr("fill",f=>COL[K[f.id]]||"#7f9d6a");
 svg.call(d3.behavior.drag().on("drag",()=>{const r=gp.rotate(),k=.42*150/gp.scale();gp.rotate([r[0]+d3.event.dx*k,Math.max(-90,Math.min(90,r[1]-d3.event.dy*k))]);gdraw()}));
 fillSel(gf.filter(f=>f.id&&f.id!=="-99").map(f=>[f.id,f.properties.name]).sort((a,b)=>a[1].localeCompare(b[1])));
 $("ac").onchange=()=>flyTo($("ac").value);gdraw()}
function flyTo(code){const f=gf&&gf.find(x=>x.id===code);if(!f)return;const c=d3.geo.centroid(f),ir=d3.interpolate(gp.rotate(),[-c[0],-c[1]]),is=d3.interpolate(gp.scale(),Math.max(gp.scale(),230));
 d3.transition().duration(2000).tween("r",()=>t=>{gp.rotate(ir(t));setS(is(t))})}
function rMap(adm){initGlobe();if(!gp)return;K={};
 for(const c of S.countries){if(!c.code)continue;const w=wr(c.id);K[c.code]=(!adm&&c.id===myId)?"me":(!adm&&w&&w.st==="war")?"war":"taken"}
 gdraw();
 if(!adm&&S.me&&!flown){const c=S.countries.find(x=>x.id===myId);if(c&&c.code){flown=true;flyTo(c.code)}}}

const act={
 async reg(){const n=$("n").selectedOptions[0]?.text||"",u=nu($("u").value);if(!n||!u)return err("نام کشور و UID را وارد کنید");if(!okU(u))return err("UID نامعتبر است");
  const j=await call("register",{p_uid:u,p_name:n});if(!j)return;myId=j.id;tok=j.token;ls("id",myId);ls("tok",tok);flown=false},
 logout(){ls("id",null);ls("tok",null);myId=tok=null;S.me=null;last=""},
 zi(){if(gp)setS(gp.scale()*1.25)},zo(){if(gp)setS(gp.scale()/1.25)},
 async collect(){const j=await call("collect",P());if(j)err("درآمد: +"+fmt(j.gain),1)},
 async buy(e){await call("buy",{...P(),p_item:Number(e.id)})},
 async war(e){await call("declare_war",{...P(),p_t:Number(e.id)})},
 async pp(e){await call("propose_peace",{...P(),p_t:Number(e.id)})},
 async acc(e){await call("accept_peace",{...P(),p_t:Number(e.id)})},
 async atk(e){const j=await call("attack",{...P(),p_t:Number(e.id)});if(j)j.win?err("پیروز شدید! "+fmt(j.amt)+" غنیمت گرفتید",1):err("شکست خوردید! "+fmt(j.amt)+" از دست دادید")},
 async send(){const x=$("cm").value.trim();if(!x)return;const v=$("ct").value;if(await call("send_chat",{...P(),p_to:v==="all"?0:Number(v),p_text:x}))$("cm").value=""},
 async unlock(){const p=$("pw").value;if(!p)return err("رمز را وارد کنید");if(!await call("admin_login",{p_pw:p}))return;pw=p;try{sessionStorage.setItem("pw",p)}catch(e){}$("pw").value="";last=""},
 exitadm(){pw=null;try{sessionStorage.removeItem("pw")}catch(e){}location.hash=""},
 async setpw(){const v=$("np").value;if(!await call("admin_setpw",AD({p_new:v})))return;pw=v;try{sessionStorage.setItem("pw",v)}catch(e){}$("np").value="";err("رمز تغییر کرد",1)},
